<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">镜界 Scenery 短视频工厂 Agent 架构（动画）</title>
  <desc id="archDesc">脉冲沿生产流水线依次点亮素材导入、编剧拆解、结构化分镜、H3 渲染、质检取证、失败修复、成片导出七个阶段；下方事实来源承接各阶段事件，再下为五层模块落点。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#FBF3E8"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8833A"/>
      <stop offset="0.5" stop-color="#F2B23E"/>
      <stop offset="1" stop-color="#EF9A78"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
    .title  { font-size: 29px; font-weight: 700; fill: #453224; }
    .sub    { font-size: 14px; fill: #8B7A66; }
    .badge  { font-size: 12px; fill: #9A6A22; text-anchor: middle; }
    .seclab { font-size: 13.5px; font-weight: 600; fill: #B5671A; }
    .sidenote { font-size: 12.5px; fill: #A79582; }
    .stage  { font-size: 14.5px; font-weight: 600; fill: #453224; text-anchor: middle; }
    .stagesub { font-size: 10.5px; fill: #A79582; text-anchor: middle; }
    .idx    { font-size: 10.5px; font-weight: 700; fill: #B5671A; text-anchor: middle; }
    .chiptx { font-size: 11.5px; fill: #8B6B3E; text-anchor: middle; }
    .lname  { font-size: 14.5px; font-weight: 600; fill: #453224; }
    .lmod   { font-size: 12px; fill: #8B7A66; }
    .ldel   { font-size: 12px; font-weight: 600; fill: #C4823C; text-anchor: end; }
    .foot   { font-size: 12px; fill: #A79582; }
    .metric { font-size: 12.5px; font-weight: 600; fill: #C4762A; text-anchor: end; }

    .hflow { stroke-dasharray: 6 10; animation: hdash 1.6s linear infinite; }
    @keyframes hdash { to { stroke-dashoffset: -32; } }
    .vflow { stroke-dasharray: 4 7; animation: vdash 1.1s linear infinite; }
    @keyframes vdash { to { stroke-dashoffset: -22; } }

    .travel { animation: travel 7s linear infinite; }
    @keyframes travel {
      0%   { transform: translateX(0); opacity: 0; }
      2%   { opacity: 1; }
      96%  { opacity: 1; }
      100% { transform: translateX(1122px); opacity: 0; }
    }

    .wash { animation: wash 7s linear infinite; }
    @keyframes wash {
      0%   { opacity: 0; }
      1.5% { opacity: .30; }
      6%   { opacity: .15; }
      13%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .ring { fill: none; stroke: #E8833A; stroke-width: 1.8;
            transform-box: fill-box; transform-origin: center;
            animation: ring 7s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes ring {
      0%   { opacity: 0; transform: scale(.95); }
      2%   { opacity: 1; transform: scale(1.005); }
      7%   { opacity: .45; transform: scale(1.025); }
      14%  { opacity: 0; transform: scale(1.04); }
      100% { opacity: 0; }
    }

    .bandwash { animation: bandwash 7s ease-in-out infinite; }
    @keyframes bandwash {
      0%   { opacity: 0; }
      7%   { opacity: .42; }
      34%  { opacity: .14; }
      62%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .bandbar { animation: bandbar 7s ease-in-out infinite; }
    @keyframes bandbar {
      0%   { opacity: 0; }
      7%   { opacity: 1; }
      34%  { opacity: .35; }
      62%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .halo { transform-box: fill-box; transform-origin: center;
            animation: halo 2.2s ease-out infinite; }
    @keyframes halo {
      0%   { opacity: .55; transform: scale(.5); }
      100% { opacity: 0;   transform: scale(2.4); }
    }

    .breath { animation: breath 3.6s ease-in-out infinite; }
    @keyframes breath {
      0%, 100% { stroke-opacity: 1; }
      50%      { stroke-opacity: .45; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect x="0" y="0" width="1280" height="760" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#topbar)"/>

  <!-- ======== 标题 ======== -->
  <text class="title" x="64" y="60">镜界 Scenery · 短视频工厂 Agent</text>
  <text class="sub" x="64" y="88">数据库与事件流是事实来源，Agent 是可替换的角色任务</text>
  <rect x="956" y="32" width="260" height="40" rx="20" fill="#FDF1E3" stroke="#EBCFA8" stroke-width="1.2"/>
  <text class="badge" x="1086" y="57">Fusion Xpark GB10 本地算力</text>

  <!-- ======== 生产流水线 ======== -->
  <text class="seclab" x="64" y="138">生产流水线</text>
  <text class="sidenote" x="186" y="138">一次 RUN 一条链，全程可回放</text>
  <circle cx="1212" cy="133" r="5" fill="#E8833A"/>
  <circle class="halo" cx="1212" cy="133" r="5" fill="none" stroke="#E8833A" stroke-width="1.6"/>

  <line class="hflow" x1="79" y1="228" x2="1201" y2="228" stroke="#E4D5C0" stroke-width="2"/>

  <g class="travel">
    <circle cx="79" cy="228" r="13" fill="#F6A65E" fill-opacity="0.35"/>
    <circle cx="79" cy="228" r="6.5" fill="#E8833A"/>
  </g>

  <g stroke="#D9C7AE" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M227.5 223.5 L232.5 228 L227.5 232.5"/>
    <path d="M391.5 223.5 L396.5 228 L391.5 232.5"/>
    <path d="M555.5 223.5 L560.5 228 L555.5 232.5"/>
    <path d="M719.5 223.5 L724.5 228 L719.5 232.5"/>
    <path d="M883.5 223.5 L888.5 228 L883.5 232.5"/>
    <path d="M1047.5 223.5 L1052.5 228 L1047.5 232.5"/>
  </g>

  <!-- 1 素材导入 -->
  <g>
    <rect x="79" y="186" width="138" height="84" rx="14" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.4"/>
    <rect class="wash" x="79" y="186" width="138" height="84" rx="14" fill="#F6A65E" opacity="0" style="animation-delay:0.43s"/>
    <rect class="ring" x="79" y="186" width="138" height="84" rx="14" opacity="0" style="animation-delay:0.43s"/>
    <circle cx="96" cy="204" r="9.5" fill="#F6E3CE"/>
    <text class="idx" x="96" y="207.8">1</text>
    <circle cx="148" cy="212" r="14" fill="#FBEADB"/>
    <g stroke="#C4762A" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M148 204.5 v12"/>
      <path d="M143.5 212 L148 216.5 L152.5 212"/>
      <path d="M141 221 h14"/>
    </g>
    <text class="stage" x="148" y="246">素材导入</text>
    <text class="stagesub" x="148" y="264">哈希 · 版本</text>
  </g>

  <!-- 2 编剧拆解 -->
  <g>
    <rect x="243" y="186" width="138" height="84" rx="14" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.4"/>
    <rect class="wash" x="243" y="186" width="138" height="84" rx="14" fill="#F6A65E" opacity="0" style="animation-delay:1.45s"/>
    <rect class="ring" x="243" y="186" width="138" height="84" rx="14" opacity="0" style="animation-delay:1.45s"/>
    <circle cx="260" cy="204" r="9.5" fill="#F6E3CE"/>
    <text class="idx" x="260" y="207.8">2</text>
    <circle cx="312" cy="212" r="14" fill="#FBEADB"/>
    <g stroke="#C4762A" stroke-width="1.7" fill="none" stroke-linecap="round">
      <rect x="303" y="204" width="18" height="17" rx="3"/>
      <path d="M307 210 h10"/>
      <path d="M307 214.5 h6"/>
    </g>
    <text class="stage" x="312" y="246">编剧拆解</text>
    <text class="stagesub" x="312" y="264">场景 · 角色</text>
  </g>

  <!-- 3 结构化分镜 -->
  <g>
    <rect x="407" y="186" width="138" height="84" rx="14" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.4"/>
    <rect class="wash" x="407" y="186" width="138" height="84" rx="14" fill="#F6A65E" opacity="0" style="animation-delay:2.48s"/>
    <rect class="ring" x="407" y="186" width="138" height="84" rx="14" opacity="0" style="animation-delay:2.48s"/>
    <circle cx="424" cy="204" r="9.5" fill="#F6E3CE"/>
    <text class="idx" x="424" y="207.8">3</text>
    <circle cx="476" cy="212" r="14" fill="#FBEADB"/>
    <g fill="none" stroke="#C4762A" stroke-width="1.5">
      <rect x="469" y="205" width="6" height="6" rx="1.4"/>
      <rect x="477" y="205" width="6" height="6" rx="1.4"/>
      <rect x="469" y="213" width="6" height="6" rx="1.4"/>
      <rect x="477" y="213" width="6" height="6" rx="1.4"/>
    </g>
    <text class="stage" x="476" y="246">结构化分镜</text>
    <text class="stagesub" x="476" y="264">ShotSpec 契约</text>
  </g>

  <!-- 4 H3 渲染 -->
  <g>
    <rect x="571" y="186" width="138" height="84" rx="14" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.4"/>
    <rect class="wash" x="571" y="186" width="138" height="84" rx="14" fill="#F6A65E" opacity="0" style="animation-delay:3.5s"/>
    <rect class="ring" x="571" y="186" width="138" height="84" rx="14" opacity="0" style="animation-delay:3.5s"/>
    <circle cx="588" cy="204" r="9.5" fill="#F6E3CE"/>
    <text class="idx" x="588" y="207.8">4</text>
    <circle cx="640" cy="212" r="14" fill="#FBEADB"/>
    <g stroke="#C4762A" stroke-width="1.7" fill="none" stroke-linecap="round">
      <rect x="632" y="207" width="16" height="14" rx="2.5"/>
      <path d="M637.5 204 v3"/>
      <path d="M642.5 204 v3"/>
      <path d="M637.5 221 v3"/>
      <path d="M642.5 221 v3"/>
    </g>
    <text class="stage" x="640" y="246">H3 渲染</text>
    <text class="stagesub" x="640" y="264">MiniMax-H3</text>
  </g>

  <!-- 5 质检取证 -->
  <g>
    <rect x="735" y="186" width="138" height="84" rx="14" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.4"/>
    <rect class="wash" x="735" y="186" width="138" height="84" rx="14" fill="#F6A65E" opacity="0" style="animation-delay:4.52s"/>
    <rect class="ring" x="735" y="186" width="138" height="84" rx="14" opacity="0" style="animation-delay:4.52s"/>
    <circle cx="752" cy="204" r="9.5" fill="#F6E3CE"/>
    <text class="idx" x="752" y="207.8">5</text>
    <circle cx="804" cy="212" r="14" fill="#FBEADB"/>
    <g stroke="#C4762A" stroke-width="1.7" fill="none" stroke-linecap="round">
      <circle cx="801" cy="209" r="5.5"/>
      <path d="M805.2 213.2 L810 218"/>
    </g>
    <text class="stage" x="804" y="246">质检取证</text>
    <text class="stagesub" x="804" y="264">ScoreReport</text>
  </g>

  <!-- 6 失败修复 -->
  <g>
    <rect x="899" y="186" width="138" height="84" rx="14" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.4"/>
    <rect class="wash" x="899" y="186" width="138" height="84" rx="14" fill="#F6A65E" opacity="0" style="animation-delay:5.55s"/>
    <rect class="ring" x="899" y="186" width="138" height="84" rx="14" opacity="0" style="animation-delay:5.55s"/>
    <circle cx="916" cy="204" r="9.5" fill="#F6E3CE"/>
    <text class="idx" x="916" y="207.8">6</text>
    <circle cx="968" cy="212" r="14" fill="#FBEADB"/>
    <g stroke="#C4762A" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M968 205 a7 7 0 1 1 -5.6 2.8"/>
      <path d="M964.8 201.8 L968 205 L964.8 208.2"/>
    </g>
    <text class="stage" x="968" y="246">失败修复</text>
    <text class="stagesub" x="968" y="264">RepairPlan</text>
  </g>

  <!-- 7 成片导出 -->
  <g>
    <rect x="1063" y="186" width="138" height="84" rx="14" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.4"/>
    <rect class="wash" x="1063" y="186" width="138" height="84" rx="14" fill="#F6A65E" opacity="0" style="animation-delay:6.57s"/>
    <rect class="ring" x="1063" y="186" width="138" height="84" rx="14" opacity="0" style="animation-delay:6.57s"/>
    <circle cx="1080" cy="204" r="9.5" fill="#F6E3CE"/>
    <text class="idx" x="1080" y="207.8">7</text>
    <circle cx="1132" cy="212" r="14" fill="#FBEADB"/>
    <g stroke="#C4762A" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1132 217 v-12"/>
      <path d="M1127.5 209.5 L1132 205 L1136.5 209.5"/>
      <path d="M1125 220 h14"/>
    </g>
    <text class="stage" x="1132" y="246">成片导出</text>
    <text class="stagesub" x="1132" y="264">FFmpeg 合成</text>
  </g>

  <!-- ======== 事实来源 ======== -->
  <g class="vflow" stroke="#E4D5C0" stroke-width="1.6">
    <line x1="148" y1="276" x2="148" y2="316"/>
    <line x1="476" y1="276" x2="476" y2="316"/>
    <line x1="804" y1="276" x2="804" y2="316"/>
    <line x1="1132" y1="276" x2="1132" y2="316"/>
  </g>

  <rect class="breath" x="64" y="320" width="1152" height="42" rx="13" fill="#FFF7EC" stroke="#EBCFA8" stroke-width="1.4"/>
  <text class="seclab" x="88" y="346">事实来源 · SQLite + 事件流</text>

  <g>
    <rect x="320" y="329" width="118" height="24" rx="12" fill="#FFFFFF" stroke="#EBCFA8" stroke-width="1.1"/>
    <text class="chiptx" x="379" y="345">ShotSpec</text>
    <rect x="450" y="329" width="118" height="24" rx="12" fill="#FFFFFF" stroke="#EBCFA8" stroke-width="1.1"/>
    <text class="chiptx" x="509" y="345">Run</text>
    <rect x="580" y="329" width="118" height="24" rx="12" fill="#FFFFFF" stroke="#EBCFA8" stroke-width="1.1"/>
    <text class="chiptx" x="639" y="345">ScoreReport</text>
    <rect x="710" y="329" width="118" height="24" rx="12" fill="#FFFFFF" stroke="#EBCFA8" stroke-width="1.1"/>
    <text class="chiptx" x="769" y="345">RepairPlan</text>
  </g>
  <text class="sidenote" x="1204" y="346" text-anchor="end">command_id 幂等 · 事件游标回放 · 断点续跑</text>

  <!-- ======== 五层架构 ======== -->
  <text class="seclab" x="64" y="406">五层架构 · 模块落点</text>

  <g>
    <rect x="64" y="424" width="1152" height="44" rx="12" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.3"/>
    <rect class="bandwash" x="64" y="424" width="1152" height="44" rx="12" fill="#F6A65E" opacity="0" style="animation-delay:0.4s"/>
    <rect x="76" y="434" width="4" height="24" rx="2" fill="#E8833A"/>
    <rect class="bandbar" x="76" y="434" width="4" height="24" rx="2" fill="#C4762A" opacity="0" style="animation-delay:0.4s"/>
    <text class="lname" x="92" y="453">Web 产品层</text>
    <text class="lmod" x="252" y="452">apps/web（原生 HTML / CSS / JS，零构建）· 项目 / 素材 / 分镜 / 任务 / 审核 / 成片 · #/chat 对话出片</text>
    <text class="ldel" x="1204" y="452">交付：工作台页面</text>
  </g>

  <g>
    <rect x="64" y="477" width="1152" height="44" rx="12" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.3"/>
    <rect class="bandwash" x="64" y="477" width="1152" height="44" rx="12" fill="#F6A65E" opacity="0" style="animation-delay:1.8s"/>
    <rect x="76" y="487" width="4" height="24" rx="2" fill="#EF9A78"/>
    <rect class="bandbar" x="76" y="487" width="4" height="24" rx="2" fill="#C4762A" opacity="0" style="animation-delay:1.8s"/>
    <text class="lname" x="92" y="506">编排与决策层</text>
    <text class="lmod" x="252" y="505">apps/api（FastAPI + SSE）、domain/state_machine、adapters/decision（Laya 影子模式 / Jev 占位）</text>
    <text class="ldel" x="1204" y="505">交付：SSE 事件流</text>
  </g>

  <g>
    <rect x="64" y="530" width="1152" height="44" rx="12" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.3"/>
    <rect class="bandwash" x="64" y="530" width="1152" height="44" rx="12" fill="#F6A65E" opacity="0" style="animation-delay:3.2s"/>
    <rect x="76" y="540" width="4" height="24" rx="2" fill="#F2B23E"/>
    <rect class="bandbar" x="76" y="540" width="4" height="24" rx="2" fill="#C4762A" opacity="0" style="animation-delay:3.2s"/>
    <text class="lname" x="92" y="559">创作与资产层</text>
    <text class="lmod" x="252" y="558">agents/（制片 / 编剧 / 选角 / 导演 / 提示词 / 审核 / 修复）、ingestion、adapters/asset_store</text>
    <text class="ldel" x="1204" y="558">交付：ShotSpec 契约</text>
  </g>

  <g>
    <rect x="64" y="583" width="1152" height="44" rx="12" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.3"/>
    <rect class="bandwash" x="64" y="583" width="1152" height="44" rx="12" fill="#F6A65E" opacity="0" style="animation-delay:4.6s"/>
    <rect x="76" y="593" width="4" height="24" rx="2" fill="#D9A05B"/>
    <rect class="bandbar" x="76" y="593" width="4" height="24" rx="2" fill="#C4762A" opacity="0" style="animation-delay:4.6s"/>
    <text class="lname" x="92" y="612">生成与质检层</text>
    <text class="lmod" x="252" y="611">adapters/comfyui（MiniMax-H3）、quality（抽帧 / 密度 / 证据）、adapters/vision_judge</text>
    <text class="ldel" x="1204" y="611">交付：ScoreReport</text>
  </g>

  <g>
    <rect x="64" y="636" width="1152" height="44" rx="12" fill="#FFFFFF" stroke="#EADDCB" stroke-width="1.3"/>
    <rect class="bandwash" x="64" y="636" width="1152" height="44" rx="12" fill="#F6A65E" opacity="0" style="animation-delay:6.0s"/>
    <rect x="76" y="646" width="4" height="24" rx="2" fill="#C9853F"/>
    <rect class="bandbar" x="76" y="646" width="4" height="24" rx="2" fill="#C4762A" opacity="0" style="animation-delay:6.0s"/>
    <text class="lname" x="92" y="665">交付与恢复层</text>
    <text class="lmod" x="252" y="664">workers/compose（FFmpeg 合成）、command_id 幂等、事件游标回放</text>
    <text class="ldel" x="1204" y="664">交付：成片 + 断点续跑</text>
  </g>

  <!-- ======== 页脚 ======== -->
  <line x1="64" y1="698" x2="1216" y2="698" stroke="#EFE2D0" stroke-width="1"/>
  <text class="foot" x="64" y="726">ComfyUI + MiniMax-H3 · Laya 影子决策 / OpenJev 实验路径 · FFmpeg 合成 · SQLite 事实来源</text>
  <text class="metric" x="1216" y="726">5 秒 4 step 热缓存：530.2s → 340.1s（-35.9%）</text>
</svg>
